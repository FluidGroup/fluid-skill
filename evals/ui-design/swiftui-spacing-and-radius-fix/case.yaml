name: swiftui-spacing-and-radius-fix
expected_outcome: |
  A small, targeted fix to SceneCardsView.swift, not a redesign. The vague feedback is restated as
  constraints with numbers: the card gap moves to a step on a 4pt spacing scale that is smaller
  than before, and the image corner becomes concentric with the card (outer radius minus the
  inset, or the system's concentric shape behind an availability check). The content and structure
